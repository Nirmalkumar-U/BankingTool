<body>
  <div class="dashboard" *ngIf="isLogined">
    <div class="dashboard-nav" [class.mobile-show]="isMobileNavVisible">
      <header>
        <a href="#" class="brand-logo">
          <fa-icon [icon]="aHandshake"></fa-icon>
          <span class="p-1">Banking Tool</span>
        </a>
      </header>
      <nav class="dashboard-nav-list">
        <a [routerLink]="[appPaths.home]" class="dashboard-nav-item">
          <fa-icon [icon]="aHouse"></fa-icon> <span class="p-1">Home</span>
        </a>
        <div class="dashboard-nav-dropdown"
             *ngFor="let dropdown of Menus"
             [class.show]="dropdown.isOpen">
          <a class="dashboard-nav-item dashboard-nav-dropdown-toggle"
             (click)="toggleDropdown(dropdown)">
            <fa-icon [icon]="aMoneyBill1" size="lg"></fa-icon> <span class="p-1">{{ dropdown.label }}</span>
          </a>
          <div class="dashboard-nav-dropdown-menu">
            <a *ngFor="let item of dropdown.items"
               class="dashboard-nav-dropdown-item"
               [routerLink]="[item.path]">
              {{ item.menu }}
            </a>
          </div>
        </div>
        <div class="nav-item-divider"></div>
        <a href="#" class="dashboard-nav-item" (click)="logout()">
          <fa-icon [icon]="aArrowAltCircleRight" size="lg"></fa-icon> <span class="p-1">Logout</span>
        </a>
      </nav>
    </div>
    <div class="dashboard-app" [class.dashboard-compact]="isCompact">
      <header class="dashboard-toolbar">
        <div class="container-fluid">
          <div class="toolbar-row d-flex justify-content-between align-items-center gap-3">
            <button class="mobile-menu-toggle" type="button" (click)="toggleMobileNav()" aria-label="Toggle menu">
              <fa-icon [icon]="aBars"></fa-icon>
            </button>

            <div class="d-flex align-items-center gap-3 ms-auto">
              <div class="toolbar-badge">
                <fa-icon [icon]="aBell"></fa-icon>
                <span class="ms-2">Updates</span>
              </div>

              <div class="dropdown">
                <span class="btn btn-light dropdown-toggle topbar-icon-btn" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                  <fa-icon [icon]="aBell"></fa-icon>
                </span>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="dropdownMenuButton1">
                  <ng-container *ngFor="let menu of notificationMenus">
                    <li *ngFor="let item of menu.items">
                      <a class="dropdown-item" [routerLink]="[item.path]">{{ item.menu }}</a>
                    </li>
                  </ng-container>
                </ul>
              </div>

              <div class="user-chip">
                <span class="user-avatar">{{ logggedInUserName?.charAt(0)?.toUpperCase() || 'U' }}</span>
                <span>{{ logggedInUserName }}</span>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="dashboard-content p-1">
        <router-outlet></router-outlet>
      </div>
      <footer class="dashboard-footer">
        <span>© 2026 Banking Tool</span>
        <span class="footer-divider">|</span>
        <span>Secure • Smart • Simple</span>
      </footer>
    </div>
  </div>

  <div *ngIf="!isLogined">
    <router-outlet></router-outlet>
  </div>
  <app-loader></app-loader>
  <app-notification-popup></app-notification-popup>
  <app-note *ngIf="isLogined"></app-note>
</body>

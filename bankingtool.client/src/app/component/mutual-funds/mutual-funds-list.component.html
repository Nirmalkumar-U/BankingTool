<div class='dashboard-content'>
  <div class='container-fluid'>
    <!-- Selected Schemes Section -->
    <div class='card mb-4' *ngIf='selectedSchemes && selectedSchemes.length > 0'>
      <div class='card-header'>
        <h2>Selected Schemes ({{ selectedSchemes.length }})</h2>
      </div>
      <div class='card-body'>
        <div class='row mb-3'>
          <div class='col-12'>
            <div class='list-group'>
              <div class='list-group-item' *ngFor='let schemeCode of selectedSchemes; let i = index'>
                <div class='d-flex justify-content-between align-items-center'>
                  <div>
                    <h5 class='mb-1'>{{ getSchemeNameByCode(schemeCode) }}</h5>
                    <p class='mb-0 text-muted'>Code: {{ schemeCode }}</p>
                  </div>
                  <button class='btn btn-sm btn-danger' (click)='removeScheme(schemeCode)'>Remove</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class='row'>
          <div class='col-12'>
            <button class='btn btn-primary me-2' (click)='saveSchemes()'>
              Save Schemes
            </button>
            <button class='btn btn-secondary' (click)='selectedSchemes = []'>Clear Selection</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Mutual Funds List Section -->
    <div class='card mb-4'>
      <div class='card-header'>
        <h1>Available Mutual Funds</h1>
        <p class="text-muted">Click "Add" to select schemes you want to invest in</p>
      </div>

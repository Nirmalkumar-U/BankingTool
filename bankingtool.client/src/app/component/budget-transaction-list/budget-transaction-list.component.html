<div class='dashboard-content'>
  <div class='container'>
    <div class='card'>
      <div class='card-header'>
        <h1>Budget Transactions</h1>
      </div>
      <div class='card-body'>
        <div class="row p-2" *ngIf="accountInfo && accountInfo != null">
          <div class="col-md-3">
            <h4>Budget Name</h4>
            <h6>{{accountInfo.budgetName}}</h6>
          </div>
          <div class="col-md-3">
            <h4>Budget Number</h4>
            <h6>{{accountInfo.budgetNumber}}</h6>
          </div>
          <div class="col-md-3">
            <h4>Budget Status</h4>
            <h6>{{accountInfo.budgetStatus}}</h6>
          </div>
          <div class="col-md-3">
            <h4>Balance</h4>
            <h6>{{accountInfo.balance}}</h6>
          </div>
        </div>
        <hr />
        <app-data-table [columns]="columns"
                        [data]="accountInfo?.budgetTransactionList || []">
        </app-data-table>

      </div>
    </div>
  </div>
</div>

<div class='dashboard-content'>
  <div class='container'>
    <div class='card'>
      <div class='card-header'>
        <h1>Budget Transactions</h1>
      </div>
      <div class='card-body'>
        <div class="row p-2" *ngIf="accountInfo && accountInfo != null">
          <div class="col-md-3">
            <h4 class="fw-bold">Budget Name</h4>
            <h5 class="fw-bold">{{accountInfo.budgetName}}</h5>
          </div>
          <div class="col-md-3">
            <h4 class="fw-bold">Budget Number</h4>
            <h5 class="fw-bold">{{accountInfo.budgetNumber}}</h5>
          </div>
          <div class="col-md-3">
            <h4 class="fw-bold">Budget Status</h4>
            <h5 class="fw-bold">{{accountInfo.budgetStatus}}</h5>
          </div>
          <div class="col-md-3">
            <h4 class="fw-bold">Balance</h4>
            <h5 class="fw-bold">{{accountInfo.balance}}</h5>
          </div>
        </div>
        <hr />
        <app-data-table [columns]="columns"
                        [data]="accountInfo?.budgetTransactionList || []">
        </app-data-table>

      </div>
    </div>
  </div>
</div>

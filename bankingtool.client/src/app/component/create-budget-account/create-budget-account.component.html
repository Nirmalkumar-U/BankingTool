<div class='dashboard-content'>
  <div class='container'>
    <div class='card'>
      <div class='card-header'>
        <h1>Create Budget Account</h1>
      </div>
      <div class='card-body'>
        <form class="row g-3 was-validated" novalidate [formGroup]="budgetAccountForm" (ngSubmit)="createBudgetAccount()">
          <div class="col-md-3">
            <label class="form-label">Budget Name</label>
            <input type="text" class="form-control" formControlName="budgetName" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Budget Amount</label>
            <input type="text" class="form-control" formControlName="amount" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Create Budget Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

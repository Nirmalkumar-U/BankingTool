<h2 mat-dialog-title>Add New Event</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="event-form">

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" placeholder="Event title">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" placeholder="Event details"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Start Date</mat-label>
      <input matInput type="date" formControlName="startDateTime">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>End Date</mat-label>
      <input matInput type="date" formControlName="endDateTime">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Event Type</mat-label>
      <mat-select formControlName="eventType">
        <mat-option value="Event">Event</mat-option>
        <mat-option value="Reminder">Reminder</mat-option>
        <mat-option value="Holiday">Holiday</mat-option>
        <mat-option value="Note">Note</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-checkbox formControlName="isAllDay">All Day</mat-checkbox>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>

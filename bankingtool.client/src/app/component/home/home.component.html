<div class="container">
  <h2 class="mb-4 text-primary d-flex align-items-center">
    <i class="bi bi-wallet2 me-2 fs-3"></i> My Accounts
  </h2>

  <!-- Dashboard Summary Section -->
  <div class="row mb-5 g-3">
    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 hover-shadow">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Total Balance</div>
            <div class="fs-4 fw-semibold text-primary">{{ totalBalance | currency }}</div>
          </div>
          <i class="bi bi-cash-stack fs-2 text-primary opacity-75"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 hover-shadow">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Number of Accounts</div>
            <div class="fs-4 fw-semibold text-primary">{{totalAccounts}}</div>
          </div>
          <i class="bi bi-bank fs-2 text-primary opacity-75"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 hover-shadow">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">Savings Accounts</div>
            <div class="fs-4 fw-semibold text-primary">
              {{totalSavingsAccounts}}
            </div>
          </div>
          <i class="bi bi-piggy-bank fs-2 text-primary opacity-75"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Account Cards -->
  <div class="row g-4">
    <div class="col-sm-12 col-md-6 col-lg-4" *ngFor="let acc of accountList">
      <div class="card border-0 shadow-sm h-100 rounded-4 transition">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-4">
          <span class="truncate-text fw-semibold" title="{{ acc.bankName }}">
            <i class="bi bi-bank2 me-2"></i>{{ acc.bankName }}
          </span>
          <span class="badge bg-light text-primary text-capitalize">{{ acc.accountType }}</span>
        </div>

        <div class="card-body">
          <p class="mb-2" title="{{ acc.accountNumber }}">
            <i class="bi bi-credit-card me-2 text-primary"></i>
            <strong>Account No:</strong>
            <span class="text-muted"> {{ acc.accountNumber }}</span>
          </p>
          <p class="mb-0">
            <i class="bi bi-wallet-fill me-2 text-primary"></i>
            <strong>Balance:</strong>
            <span class="fw-semibold text-dark"> {{ acc.balance | currency }}</span>
          </p>
        </div>

        <div class="card-footer bg-white border-top d-flex justify-content-between">
          <button class="btn btn-sm btn-outline-primary" (click)="redirectTransactionList(acc.accountType, acc.accountId)">
            <i class="bi bi-eye me-1"></i> View
          </button>
          <button *ngIf="acc.accountType == 'Saving Account'" (click)="redirectTransferAmount()" class="btn btn-sm btn-primary">
            <i class="bi bi-arrow-left-right me-1"></i> Transfer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

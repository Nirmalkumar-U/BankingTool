<div class="login-page">
  <div class="login-shell">
    <aside class="brand-panel">
      <div class="brand-badge">BT</div>
      <div class="brand-copy">
        <span class="eyebrow">Smart finance</span>
        <h1>Banking Tool</h1>
      </div>
      <p class="brand-description">
        Manage accounts, budgets, and performance with secure visibility across every transaction.
      </p>

      <ul class="feature-list">
        <li>Real-time account insights</li>
        <li>Budget and portfolio tracking</li>
        <li>Protected access with clear control</li>
      </ul>
    </aside>

    <section class="login-card">
      <div class="login-header">
        <span class="eyebrow">Welcome back</span>
        <h2>Sign in</h2>
      </div>

      <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" formControlName="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Enter your password" required>
        </div>

        <div class="login-links">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>

      <div class="signup-row">
        <span>Need an account?</span>
        <a href="#">Create one</a>
      </div>
    </section>
  </div>
</div>

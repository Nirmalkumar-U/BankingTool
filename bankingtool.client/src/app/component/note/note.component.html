<!-- Floating Sticky Note Icon -->
<div class="floating-button" (click)="togglePopup()">
  📝
</div>

<!-- Notes Popup Panel -->
<div class="popup-backdrop" *ngIf="isPopupOpen">
  <div class="notes-popup shadow">
    <div class="popup-header">
      <h5>📝 My Notes</h5>
      <button class="icon-button" (click)="togglePopup()">✖</button>
    </div>

    <div class="popup-content">
      <!-- Note List -->
      <div *ngIf="!selectedNote">
        <button class="btn btn-sm btn-success mb-2 w-100" (click)="addNewNote()">➕ Add Note</button>
        <ul class="list-group">
          <li class="note-item" *ngFor="let note of notes">
            <div class="note-preview" (click)="openNote(note)">
              <div class="note-title">{{ note.title }}</div>
              <div class="note-snippet">{{ note.content | slice:0:60 }}...</div>
            </div>
            <button class="delete-icon" (click)="deleteNote(note.noteId)">🗑</button>
          </li>

        </ul>
      </div>
      <!-- Note Editor -->
      <div *ngIf="selectedNote">
        <form>
          <input type="text" class="form-control note-input mb-2"
                 placeholder="Title"
                 [(ngModel)]="selectedNote.title"
                 name="title"
                 (ngModelChange)="triggerAutoSave()" />

          <textarea class="form-control" rows="6"
                    style="min-height: calc(1.5em + 30.75rem + calc(var(--bs-border-width) * 2));"
                    placeholder="Write your note here..."
                    [(ngModel)]="selectedNote.content"
                    name="content"
                    (ngModelChange)="triggerAutoSave()"></textarea>

          <!--<div class="d-flex justify-content-between">-->
          <!--<button type="submit" class="btn btn-primary btn-sm">💾 Save</button>-->
          <!--<button type="button" class="btn btn-outline-secondry btn-sm" (click)="closeEditor()">Cancel</button>
          </div>-->
        </form>
      </div>
    </div>
  </div>
</div>
